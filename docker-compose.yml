# v5: two services, one image, one code path. They differ only in keys, endpoint and state folder.
# The real-money service starts in dry-run: it sends orders only when the owner's flag is set in the
# environment store, never from this file.
services:
  trading-live:
    build: .
    image: trading-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TRADING_MODE=live
      - ALPACA_KEY_PREFIX=LIVE
    volumes:
      - state-live:/app/state_live
      - ./logs/live:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  trading-paper-livecfg:
    build: .
    image: trading-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TRADING_MODE=paper
      - ALPACA_KEY_PREFIX=PAPER
    volumes:
      - state-paper:/app/state_paper
      - ./logs/livecfg:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes survive a redeploy: records, rails, outbox and calendar live there.
volumes:
  state-live:
  state-paper:
